name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  basic-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docs exist
        run: |
          test -f README.md
          test -f docs/ROADMAP.md
          test -f docs/REQUIREMENTS.md
          test -f docs/MVP_SCOPE.md
          test -f docs/API_DRAFT.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Self build
        run: ./scripts/self-build.sh
